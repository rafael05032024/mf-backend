quarkus:
  application:
    name: fmarket-java

  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:fmarket}
    password: ${DB_PASSWORD:fmarket}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/fmarket}

  hibernate-orm:
    database:
      generation: validate
    log:
      sql: false

  flyway:
    migrate-at-start: true

  http:
    port: 8080

app:
  jwt:
    issuer: fmarket
    secret: ${JWT_SECRET}
    expiration: PT2H

"%dev":
  app:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  quarkus:
    datasource:
      devservices:
        enabled: true
        image-name: postgres:16-alpine
    hibernate-orm:
      log:
        sql: true

"%test":
  app:
    jwt:
      secret: test-only-secret-change-me-0123456789abcdef
  quarkus:
    datasource:
      devservices:
        enabled: true
        image-name: postgres:16-alpine
