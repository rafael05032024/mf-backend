quarkus.application.name=fmarket-java

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:fmarket}
quarkus.datasource.password=${DB_PASSWORD:fmarket}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/fmarket}

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true

quarkus.http.port=8080
quarkus.http.limits.max-body-size=20M

app.jwt.issuer=fmarket
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT2H
app.jwt.cookie-secure=true

%dev.app.jwt.cookie-secure=false
%dev.app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
%dev.quarkus.hibernate-orm.log.sql=true

%test.app.jwt.secret=test-only-secret-change-me-0123456789abcdef
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine

azure.storage.container-name=media
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME}
azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY}

asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com}
asaas.access-token=${ASAAS_ACCESS_TOKEN}
asaas.address-key=${ASAAS_ADDRESS_KEY}
