services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fmarket
      POSTGRES_PASSWORD: fmarket
      POSTGRES_DB: fmarket
    ports:
      - "5432:5432"
    volumes:
      - fmarket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_URL: jdbc:postgresql://db:5432/fmarket
      DB_USERNAME: fmarket
      DB_PASSWORD: fmarket
      QUARKUS_PROFILE: prod
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Hot reload: `docker-compose up app-dev db` (pare o serviço `app`, ambos usam a porta 8080)
  app-dev:
    image: maven:3.9-eclipse-temurin-17
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: mvn -Duser.home=/var/maven quarkus:dev -Dquarkus.http.host=0.0.0.0 -Ddebug=5005 -DdebugHost=0.0.0.0
    environment:
      DB_URL: jdbc:postgresql://db:5432/fmarket
      DB_USERNAME: fmarket
      DB_PASSWORD: fmarket
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - .:/app
      - ${HOME}/.m2:/var/maven/.m2
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  fmarket-db-data:
